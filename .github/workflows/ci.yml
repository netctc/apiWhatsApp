name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_whatsapp?schema=public

      - name: Lint source and tests
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test

  runtime-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked production runtime dependencies
        run: npm ci --omit=dev --omit=peer --omit=optional --ignore-scripts

      - name: Block installed high or critical runtime vulnerabilities
        run: npm run audit:prod

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_whatsapp_integration?schema=public
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      API_KEY_HASH_SECRET: integration-api-key-hash-secret-0123456789abcdef
      META_GRAPH_API_VERSION: v99.0
      META_HTTP_TIMEOUT_MS: "3000"
      META_APP_SECRET: integration-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: integration-verify-token
      TEST_META_ACCESS_TOKEN: integration-meta-access-token
      INTEGRATION_BURST_MESSAGES: "50"
      INTEGRATION_ACCEPT_P95_MS: "3000"
      CAPACITY_MESSAGES: "40"
      CAPACITY_CONCURRENCY: "10"
      CAPACITY_TARGET_RPS: "0"
      CAPACITY_ACCEPT_P95_MS: "3000"
      CAPACITY_ACCEPT_P99_MS: "5000"
      CAPACITY_MAX_ERROR_RATE: "0"
      CAPACITY_DRAIN_MAX_MS: "45000"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: api_whatsapp_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_whatsapp_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply production migrations
        run: npm run prisma:deploy

      - name: Run real integration and load smoke tests
        run: npm run test:integration

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, runtime-security, dependency-security, integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag api-whatsapp:ci .

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Test fail-closed audit policy
        run: node --test scripts/test/dependency-audit.test.mjs
      - name: Install full locked tree without lifecycle scripts
        run: npm ci --include=dev --include=peer --include=optional --ignore-scripts
      - name: Verify Prisma transitive dependency compatibility
        run: node --test scripts/test/prisma-dependency-compatibility.test.mjs
      - name: Block high or critical full-tree vulnerabilities
        run: node scripts/audit-full.mjs
