name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_whatsapp?schema=public

      - name: Lint source and tests
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test

  runtime-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked production runtime dependencies
        run: npm ci --omit=dev --omit=peer --omit=optional --ignore-scripts

      - name: Block installed high or critical runtime vulnerabilities
        run: npm run audit:prod

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, runtime-security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag api-whatsapp:ci .
