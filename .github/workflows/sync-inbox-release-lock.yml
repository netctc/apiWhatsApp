name: Sync inbox release lock metadata

on:
  push:
    branches:
      - feature/agent-inbox-foundation
    paths:
      - package.json
      - .github/workflows/sync-inbox-release-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-inbox-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize package-lock project version only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit lock metadata when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync 0.18.0 lock metadata'
          git push origin HEAD:feature/agent-inbox-foundation
