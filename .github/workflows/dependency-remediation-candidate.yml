name: Dependency remediation candidate

on:
  pull_request:
    paths:
      - .github/workflows/dependency-remediation-candidate.yml

jobs:
  evaluate-candidate:
    if: github.repository == 'netctc/apiWhatsApp' && github.event.pull_request.number == 57 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/dependency-audit-fail-closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare only the reviewed transitive version overrides
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          pkg.overrides = { ...pkg.overrides,
            '@prisma/config': { 'deepmerge-ts': '8.0.1' },
            prisma: { mysql2: '3.23.1' }
          };
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Report and constrain lockfile changes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.deepEqual(after.packages[''], before.packages['']);
          const paths = new Set([...Object.keys(before.packages), ...Object.keys(after.packages)]);
          const changes = [...paths].filter(path => JSON.stringify(before.packages[path]) !== JSON.stringify(after.packages[path]));
          assert.ok(changes.length <= 25, 'Unexpectedly broad lockfile update');
          for (const path of changes) console.log(JSON.stringify({ path, before: before.packages[path], after: after.packages[path] }));
          const allowed = new Set(['package.json', 'package-lock.json']);
          const files = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n');
          assert.ok(files.every(file => allowed.has(file)), 'Unexpected file modification');
          NODE
      - name: Install candidate reproducibly without lifecycle scripts
        run: npm ci --include=dev --include=peer --include=optional --ignore-scripts
      - name: Audit complete candidate dependency tree
        run: node scripts/audit-full.mjs
      - name: Generate Prisma and validate the application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_whatsapp?schema=public
        run: |
          npm run prisma:generate
          npm run lint
          npm run build
          npm test
      - name: Store candidate file blobs for explicit review, without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const path of ['package.json', 'package-lock.json']) {
            const content = readFileSync(path, 'utf8');
            const expected = createHash('sha1').update(`blob ${Buffer.byteLength(content)}\0`).update(content).digest('hex');
            const response = await fetch('https://api.github.com/repos/netctc/apiWhatsApp/git/blobs', {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content, encoding: 'utf-8' }),
              signal: AbortSignal.timeout(30_000),
            });
            if (!response.ok) throw new Error(`Candidate blob request failed: HTTP ${response.status}`);
            const body = await response.json();
            if (body.sha !== expected) throw new Error('Candidate blob hash mismatch');
            console.log(JSON.stringify({ candidateFile: path, sha: body.sha }));
          }
          NODE
