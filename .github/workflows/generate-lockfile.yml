name: Generate dependency lockfile

on:
  push:
    branches: [feature/supply-chain-hardening]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate package lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit production runtime dependencies
        run: npm audit --omit=dev --omit=peer --json > npm-audit-production.json || true

      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: |
            package-lock.json
            npm-audit-production.json
          retention-days: 1

      - name: Commit generated package lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible dependency lockfile"
            git push
          fi
