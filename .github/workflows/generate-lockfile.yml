name: Generate dependency lockfile

on:
  push:
    branches: [feature/supply-chain-hardening]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate package lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: |
            package-lock.json
            npm-audit-production.json
          retention-days: 1
